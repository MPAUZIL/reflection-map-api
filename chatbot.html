<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Social Interaction ChatBot</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
  background: #f0f2f5;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: stretch;
}
#app {
  width: 100%;
  max-width: 720px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: white;
  box-shadow: 0 0 40px rgba(0,0,0,0.08);
}
header {
  background: #1a2340;
  padding: 14px 20px;
  text-align: center;
  flex-shrink: 0;
}
header h1 { font-size: 15px; font-weight: 600; color: white; }
header p { font-size: 11px; color: #94a3b8; margin-top: 3px; }
#messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  background: #f8f9fb;
}
.msg {
  max-width: 84%;
  padding: 11px 15px;
  border-radius: 18px;
  font-size: 14.5px;
  line-height: 1.7;
  word-break: break-word;
  white-space: pre-wrap;
}
.msg.bot {
  background: white;
  color: #1f2937;
  align-self: flex-start;
  border: 1px solid #e5e7eb;
  border-bottom-right-radius: 4px;
}
.msg.user {
  background: #1a2340;
  color: white;
  align-self: flex-end;
  border-bottom-left-radius: 4px;
  white-space: normal;
}
.msg img {
  max-width: 100%;
  border-radius: 10px;
  margin-top: 8px;
  display: block;
  border: 1px solid #e5e7eb;
}
.dots span {
  display: inline-block;
  width: 7px; height: 7px;
  background: #94a3b8;
  border-radius: 50%;
  margin: 0 2px;
  animation: bop 1.2s infinite;
}
.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }
@keyframes bop { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
#starters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 10px 16px;
  background: #f8f9fb;
  border-top: 1px solid #e5e7eb;
  flex-shrink: 0;
}
.sbtn {
  background: white;
  border: 1px solid #d1d5db;
  border-radius: 20px;
  padding: 7px 14px;
  font-size: 13px;
  color: #374151;
  cursor: pointer;
  font-family: inherit;
  transition: all .15s;
}
.sbtn:hover { background: #eff6ff; border-color: #1a2340; color: #1a2340; }
#input-area {
  background: white;
  border-top: 1px solid #e5e7eb;
  padding: 12px 16px;
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}
#user-input {
  flex: 1;
  border: 1px solid #d1d5db;
  border-radius: 22px;
  padding: 9px 16px;
  font-size: 14px;
  font-family: inherit;
  resize: none;
  outline: none;
  max-height: 120px;
  overflow-y: auto;
  line-height: 1.5;
  direction: rtl;
  background: #f9fafb;
  color: #1f2937;
}
#user-input:focus { border-color: #1a2340; background: white; }
#send-btn {
  background: #1a2340;
  color: white;
  border: none;
  border-radius: 50%;
  width: 40px; height: 40px;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
#send-btn:hover { background: #2d3a5e; }
#send-btn:disabled { background: #9ca3af; cursor: not-allowed; }
.slw {
  background: white;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  border-bottom-right-radius: 4px;
  padding: 16px;
  align-self: flex-start;
  width: 100%;
  max-width: 84%;
}
.slw-title { font-size: 14px; font-weight: 600; color: #1a2340; margin-bottom: 3px; }
.slw-sub { font-size: 12px; color: #6b7280; margin-bottom: 14px; }
.sl-row { margin-bottom: 12px; }
.sl-top { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.sl-label { font-size: 13px; color: #374151; font-weight: 500; }
.sl-label small { display: block; font-size: 11px; color: #9ca3af; font-weight: 400; }
.sl-val { font-size: 14px; font-weight: 600; color: #1a2340; min-width: 36px; text-align: left; }
input[type=range] { width: 100%; accent-color: #1a2340; cursor: pointer; }
.sl-total { font-size: 13px; color: #6b7280; text-align: center; margin: 12px 0 10px; }
.sl-total span { font-weight: 700; font-size: 16px; color: #1a2340; }
.sl-total.ok span { color: #16a34a; }
.sl-total.over span { color: #dc2626; }
.sl-submit {
  width: 100%;
  padding: 10px;
  background: #1a2340;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 14px;
  font-family: inherit;
  cursor: pointer;
}
.sl-submit:disabled { background: #d1d5db; cursor: not-allowed; }
.sl-submit:not(:disabled):hover { background: #2d3a5e; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Social Interaction ChatBot</h1>
    <p>כלי מיפוי אישי מבוסס מחקר</p>
  </header>
  <div id="messages"></div>
  <div id="starters">
    <button class="sbtn" onclick="doStarter('ריב עם חבר או חברה')">ריב עם חבר או חברה</button>
    <button class="sbtn" onclick="doStarter('ויכוח בכיתה')">ויכוח בכיתה</button>
    <button class="sbtn" onclick="doStarter('תקרית על הכביש')">תקרית על הכביש</button>
    <button class="sbtn" onclick="doStarter('משהו אחר')">משהו אחר</button>
  </div>
  <div id="input-area">
    <textarea id="user-input" rows="1" placeholder="כתבו כאן..." oninput="ar(this)" onkeydown="ok(event)"></textarea>
    <button id="send-btn" onclick="doSend()">&#10148;</button>
  </div>
</div>

const SYS = `You are a psychoeducational chatbot for students. Your purpose is to help users reflect on a situation in which they felt certain they were right while another person or group saw things differently. Through a respectful, non-judgmental conversation, gently reveal patterns related to naive realism: the human tendency to experience one's own view as objective reality, while seeing disagreement as caused by the other side's lack of information, poor reasoning, bias, emotion, or self-interest. Do not mention naive realism at the beginning. First collect the user's story. Introduce the concept only after both percentage breakdowns and the comparison maps.

Conduct the conversation in Hebrew. Use clear, warm, simple Hebrew. Be friendly, curious, concise, respectful, and non-judgmental. Do not sound clinical, therapeutic, diagnostic, or academic. Do not tell the user they are biased, wrong, naive, irrational, or mistaken. Ask exactly one question at a time. Do not analyze too early. During story collection, deepen the story rather than interpreting it. Keep the full interaction concise, ideally up to 10 chatbot messages. Adjust Hebrew gender according to the user's language.

If the user starts with one of these starters: "ריב עם חבר או חברה", "ויכוח בכיתה", "תקרית על הכביש", "משהו אחר" — ask one short follow-up question to collect the concrete story. Do not repeat the opening message.

COLLECT (one question at a time):
1. The situation
2. The user's interpretation
3. The user's emotional/value-based experience
4. The other side's possible interpretation
5. The core gap between both views

Before moving to percentages, make sure all five elements are collected. If something is missing, ask one short question.

FIRST PERCENTAGE BREAKDOWN: When ready, output EXACTLY this token on its own line and nothing else:
%%ASK_SLIDERS_USER%%

Wait for the slider response in format: "דעה אובייקטיבית: X%, עובדות וידע קודם: X%, פרשנות אישית: X%, רגש: X%"

SECOND PERCENTAGE BREAKDOWN: After receiving valid user percentages, briefly summarize the other side's possible view (cautious language: "יכול להיות ש...", "ייתכן ש..."), then output EXACTLY this token on its own line:
%%ASK_SLIDERS_OTHER%%

Wait for the other side's slider response in the same format.

AFTER BOTH VALID SLIDER RESPONSES:
Say exactly: "תודה על שיתוף הבחירות שלך, המערכת מנתחת את הנתונים"
Then on a new line output ONLY this token with the actual integer numbers filled in:
%%GENERATE_MAP:{"user_objective":UO,"user_facts":UF,"user_interpretation":UI,"user_emotion":UE,"other_objective":OO,"other_facts":OF,"other_interpretation":OI,"other_emotion":OE}%%

After that token output:
"הנה המפה שמשקפת את הפער בין האופן שבו תפסת את הסיטואציה, לבין איך שהערכת את הצד השני."

Then: "בואי נסתכל עכשיו על מפות של משתתפים נוספים."
Then on its own line: %%SHOW_MAP_ALL%%

Then say EXACTLY:
"שמה לב למשהו מעניין? המפה שלך נראית כמעט בדיוק כמו המפות של שאר המשתתפים... הדפוס הזה חושף נטייה אנושית טבעית: כולנו משוכנעים שאנחנו קוראים את המציאות באופן מדויק ואובייקטיבי, ומניחים שמי שחושב אחרת מאיתנו מונע מפרשנות, רגש או אינטרסים. לנטייה הזו קוראים 'ריאליזם נאיבי'. זוהי האשליה הטבעית שאנחנו רואים את העולם 'כפי שהוא באמת', ולכן מי שחולק עלינו נתפס לעיתים כאטום, מוטה או לא רציונלי. המודעות לתופעה הזו לא אומרת שצריך לוותר על העמדות שלנו, אלא רק לזכור שנקודת המבט שלנו היא פרשנות אחת של המציאות, בדיוק כפי שהעמדה של הצד השני היא הפרשנות שלו."

Then say EXACTLY: "תודה על השתתפותך."
After this closing sentence, do not continue unless the user asks a new question.

SAFETY: You are not a therapist or diagnostic tool. If the user describes danger, abuse, or self-harm, respond supportively and encourage professional help.`;

let hist = [], busy = false;
let sv = {
  user:  {objective:0, facts:0, interpretation:0, emotion:0},
  other: {objective:0, facts:0, interpretation:0, emotion:0}
};

function ar(el) { el.style.height="auto"; el.style.height=Math.min(el.scrollHeight,120)+"px"; }
function ok(e)  { if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSend();} }
function sc()   { const m=document.getElementById("messages"); m.scrollTop=m.scrollHeight; }

function mkLoader() {
  const m=document.getElementById("messages"), d=document.createElement("div");
  d.className="msg bot";
  d.innerHTML='<div class="dots"><span></span><span></span><span></span></div>';
  m.appendChild(d); sc(); return d;
}

function addUserMsg(txt) {
  const m=document.getElementById("messages"), d=document.createElement("div");
  d.className="msg user"; d.textContent=txt; m.appendChild(d); sc();
}

function renderBot(text) {
  const m=document.getElementById("messages");
  let cur=null;
  for(const ln of text.split("\n")) {
    const t=ln.trim();
    if(t==="%%SHOW_MAP_ALL%%") {
      cur=null;
      const d=document.createElement("div"); d.className="msg bot";
      const img=document.createElement("img"); img.src=MAP_ALL; img.alt="מפות משתתפים";
      d.appendChild(img); m.appendChild(d);
    } else if(t==="%%ASK_SLIDERS_USER%%") {
      cur=null; m.appendChild(mkSlider("user"));
    } else if(t==="%%ASK_SLIDERS_OTHER%%") {
      cur=null; m.appendChild(mkSlider("other"));
    } else {
      if(!cur){cur=document.createElement("div");cur.className="msg bot";m.appendChild(cur);}
      cur.textContent+=(cur.textContent?"\n":"")+ln;
    }
  }
  sc();
}

function mkSlider(side) {
  const w=document.createElement("div"); w.className="slw"; w.id="slw-"+side;
  const ttl=side==="user"?"העמדה שלך":"העמדה של הצד השני";
  w.innerHTML=`
    <div class="slw-title">${ttl}</div>
    <div class="slw-sub">חלקי 100% בין ארבעת המרכיבים</div>
    <div id="slrows-${side}"></div>
    <div class="sl-total" id="sltot-${side}">סה"כ: <span>0</span>%</div>
    <button class="sl-submit" id="slsub-${side}" disabled onclick="submitSlider('${side}')">אישור ✓</button>
  `;
  const rows=w.querySelector("#slrows-"+side);
  DIMS.forEach(dim => {
    const r=document.createElement("div"); r.className="sl-row";
    r.innerHTML=`
      <div class="sl-top">
        <div class="sl-label">${dim.l}<small>${dim.d}</small></div>
        <div class="sl-val" id="slv-${side}-${dim.k}">0%</div>
      </div>
      <input type="range" min="0" max="100" value="0" step="1"
        oninput="updSl('${side}','${dim.k}',this.value)">
    `;
    rows.appendChild(r);
  });
  return w;
}

function updSl(side, key, v) {
  sv[side][key]=parseInt(v);
  document.getElementById("slv-"+side+"-"+key).textContent=v+"%";
  const tot=Object.values(sv[side]).reduce((a,b)=>a+b,0);
  const tel=document.getElementById("sltot-"+side);
  tel.querySelector("span").textContent=tot;
  tel.className="sl-total"+(tot===100?" ok":tot>100?" over":"");
  document.getElementById("slsub-"+side).disabled=(tot!==100);
}

function submitSlider(side) {
  const v=sv[side];
  const txt=`דעה אובייקטיבית: ${v.objective}%, עובדות וידע קודם: ${v.facts}%, פרשנות אישית: ${v.interpretation}%, רגש: ${v.emotion}%`;
  document.getElementById("slw-"+side).remove();
  addUserMsg(txt);
  hist.push({role:"user", content:txt});
  run();
}

async function callClaude(messages) {
  const r = await fetch(RAIL+"/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({system:SYS, messages})
  });
  if(!r.ok) throw new Error("API error: "+r.status);
  const d=await r.json();
  return d.content?.[0]?.text || "";
}

async function genMap(vals) {
  const r=await fetch(RAIL+"/generate-map?format=url", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(vals)
  });
  const d=await r.json();
  return d.imageUrl||null;
}

async function run() {
  busy=true; document.getElementById("send-btn").disabled=true;
  const loader=mkLoader();
  try {
    const raw=await callClaude(hist);
    loader.remove();
    const mm=raw.match(/%%GENERATE_MAP:([^%]+)%%/);
    if(mm) {
      const before=raw.substring(0,raw.indexOf("%%GENERATE_MAP:")).trim();
      const after=raw.substring(raw.indexOf("%%GENERATE_MAP:")+mm[0].length).trim();
      if(before) renderBot(before);
      const gl=mkLoader();
      try {
        const url=await genMap(JSON.parse(mm[1]));
        gl.remove();
        const d=document.createElement("div"); d.className="msg bot";
        if(url){const img=document.createElement("img");img.src=url;img.alt="מפה אישית";d.appendChild(img);}
        else {d.textContent="⚠️ לא ניתן לטעון את המפה כרגע.";}
        document.getElementById("messages").appendChild(d); sc();
      } catch(e){gl.remove(); console.error(e);}
      if(after) renderBot(after);
    } else {
      renderBot(raw);
    }
    hist.push({role:"assistant", content:raw});
  } catch(e) {
    loader.remove();
    renderBot("אירעה שגיאה. נסו שוב.");
    console.error(e);
  }
  busy=false; document.getElementById("send-btn").disabled=false;
}

function doStarter(txt) {
  document.getElementById("starters").style.display="none";
  addUserMsg(txt); hist.push({role:"user",content:txt}); run();
}

function doSend() {
  if(busy) return;
  const el=document.getElementById("user-input"), txt=el.value.trim();
  if(!txt) return;
  document.getElementById("starters").style.display="none";
  el.value=""; el.style.height="auto";
  addUserMsg(txt); hist.push({role:"user",content:txt}); run();
}
